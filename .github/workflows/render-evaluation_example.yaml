name: render-evaluation_example

# The evaluation_example vignette is slow to run, so it is precomputed from
# vignettes/evaluation_example.Rmd.orig into vignettes/evaluation_example.Rmd.
# This workflow re-knits it and opens a PR with the updated output.

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "vignettes/evaluation_example.Rmd.orig"
  schedule:
    - cron: "0 0 1 * *"

jobs:
  render-evaluation_example:
    runs-on: macos-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repos
        uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: "https://epinowcast.r-universe.dev"

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::knitr, any::purrr, local::.

      - name: Render vignette
        run: |
          setwd("vignettes")
          knitr::knit(
            "evaluation_example.Rmd.orig",
            "evaluation_example.Rmd"
          )
        shell: Rscript {0}

      - name: Upload vignette as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: vignettes
          path: vignettes

      - name: Create Pull Request
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Automatic evaluation_example vignette update"
          title: "Update evaluation_example vignette"
          body: "This is an automated pull request to update the precomputed evaluation_example vignette."
          branch: "update-evaluation_example-${{ github.run_number }}"
          labels: "documentation"
          reviewers: kaitejohnson
          add-paths: |
            vignettes
          token: ${{ secrets.GITHUB_TOKEN }}
